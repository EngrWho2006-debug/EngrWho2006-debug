name: Generate Arcade Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # run daily at midnight UTC
  workflow_dispatch: {} # allow manual trigger from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create output branch if not exists
        run: |
          git fetch --all
          git branch -r | grep origin/output || git checkout --orphan output && git push origin output

      - name: Generate arcade graph (light & dark)
        uses: abozanona/pacman-contribution-graph@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          game: pacman            # options: pacman, breakout, galaga, puzzlebobble, bomberman, minesweeper
          outputs: |
            dist/arcade-graph.svg
            dist/arcade-graph-dark.svg?theme=github-dark

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
