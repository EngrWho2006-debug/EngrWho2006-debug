name: Update README with Projects

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s "https://api.github.com/users/${{ github.repository_owner }}/repos?sort=updated&per_page=10" > repos.json
          
      - name: Update README
        run: |
          python3 << 'EOF'
          import json
          import re
          
          with open('repos.json') as f:
              repos = json.load(f)
          
          # Generate markdown
          md = "## My Projects\n\n"
          for repo in repos:
              if not repo['fork']:  # Skip forks
                  md += f"- **[{repo['name']}]({repo['html_url']})** - {repo['description'] or 'No description'}\n"
          
          # Update README
          with open('README.md') as f:
              readme = f.read()
          
          # Replace section between markers
          readme = re.sub(
              r'<!-- PROJECTS START -->.*?<!-- PROJECTS END -->',
              f'<!-- PROJECTS START -->\n{md}\n<!-- PROJECTS END -->',
              readme,
              flags=re.DOTALL
          )
          
          with open('README.md', 'w') as f:
              f.write(readme)
          EOF
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update projects list" || exit 0
          git push
