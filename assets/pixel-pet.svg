<svg xmlns="http://www.w3.org/2000/svg"
     width="180"
     height="180"
     viewBox="0 0 18 18"
     shape-rendering="crispEdges">

  <!-- Shadow -->
  <rect x="4" y="15" width="10" height="1" fill="#161b22"/>

  <!-- Ears -->
  <rect x="2" y="6" width="2" height="4" fill="#58a6ff"/>
  <rect x="14" y="6" width="2" height="4" fill="#58a6ff"/>

  <!-- Body -->
  <rect x="4" y="4" width="10" height="10" fill="#30363d"/>

  <!-- Head -->
  <rect x="5" y="3" width="8" height="8" fill="#8b949e"/>

  <!-- Face -->
  <rect x="6" y="5" width="2" height="2" fill="#0d1117"/>
  <rect x="10" y="5" width="2" height="2" fill="#0d1117"/>

  <!-- Eyes -->
  <rect x="6" y="5" width="1" height="1" fill="#58a6ff"/>
  <rect x="10" y="5" width="1" height="1" fill="#58a6ff"/>

  <!-- Mouth -->
  <rect x="7" y="8" width="4" height="1" fill="#0d1117"/>

  <!-- Chest -->
  <rect x="7" y="11" width="4" height="2" fill="#58a6ff"/>

  <!-- Feet -->
  <rect x="5" y="14" width="3" height="2" fill="#8b949e"/>
  <rect x="10" y="14" width="3" height="2" fill="#8b949e"/>

</svg>
